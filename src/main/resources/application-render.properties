# ==========================================
# PROFIL DE PRODUCTION — Render.com
# Toutes les valeurs sensibles passent par des variables d'environnement
# configurées dans le tableau de bord Render (ou render.yaml).
# ==========================================

# Base de données PostgreSQL gérée par Render (plan gratuit)
# Renseigne DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
# depuis la section "Databases" > Internal Database URL de Render.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Thymeleaf en cache (production)
spring.thymeleaf.cache=true
spring.devtools.restart.enabled=false

# Dossier d'upload persistant — disque monté sur Render au point /data/uploads
app.upload-dir=${UPLOAD_DIR:/data/uploads/}

# Email SMTP (optionnel mais recommandé)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_USERNAME:noreply@prolink.cm}

# Mot de passe du compte admin créé au démarrage
admin.password=${ADMIN_PASSWORD}

# L'application tourne derrière un proxy (HTTPS) — nécessaire pour
# les redirections et la génération correcte des liens OAuth2
server.forward-headers-strategy=framework
